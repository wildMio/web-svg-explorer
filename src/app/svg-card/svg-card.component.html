<mat-card appearance="outlined" appVirtualElement>
  <div class="flex">
    @if (loading$ | async) {
      <div
        class="loading-wrapper flex justify-center m-auto"
        [style.--loading-delay]="loadingDelay"
      >
        <div class="loading"></div>
      </div>
    }
    @if (svgUri$ | async; as uri) {
      <img
        class="m-auto svg-wrapper"
        loading="lazy"
        [src]="uri"
        [alt]="svgName$ | async"
        [class.invert]="colorInvert$ | async"
      />
      <div class="absolute top-0 left-0">
        <button
          class="opacity-30 hover:opacity-80 focus:opacity-100"
          (click)="invertColor()"
        >
          <img
            src="assets/invert_colors.svg"
            alt="invert svg color"
            loading="lazy"
            [class.invert]="colorInvert$ | async"
          />
        </button>
      </div>
      <div class="grid absolute top-0 right-0 justify-items-end gap-1">
        <div class="flex gap-1">
          @if (optimizedSvg$ | async) {
            <button
              class="opacity-30 hover:opacity-80 focus:opacity-100"
              (click)="copy()"
            >
              <img
                src="assets/copy.svg"
                alt="copy svg"
                loading="lazy"
                [class.invert]="colorInvert$ | async"
              />
            </button>
          }
          <button
            class="opacity-30 hover:opacity-80 focus:opacity-100"
            (click)="optimize()"
          >
            <img
              src="assets/optimize.svg"
              alt="optimize svg"
              loading="lazy"
              [class.invert]="colorInvert$ | async"
            />
          </button>
        </div>
        @if (pending$ | async) {
          <div class="w-full text-center">...</div>
        }
        @if (optimizedSvg$ | async) {
          <button
            class="opacity-30 hover:opacity-80 focus:opacity-100"
            (click)="download()"
          >
            <img
              src="assets/download.svg"
              alt="download svg"
              loading="lazy"
              [class.invert]="colorInvert$ | async"
            />
          </button>
        }
        <div class="text-xs" [class]="compressRationClass$ | async">
          {{ compressRatio$ | async }}
        </div>
      </div>
    }
  </div>

  <div
    class="text-center whitespace-nowrap break-all overflow-hidden text-ellipsis"
    [title]="svgName$ | async"
  >
    {{ svgName$ | async }}
  </div>
</mat-card>
